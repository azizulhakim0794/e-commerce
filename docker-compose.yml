services:
  ecommerce-postgres:
    image: postgres:17-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: console.log
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - ecommerce-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - ecommerce-network

  ecommerce-redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ecommerce-network

  ecommerce-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ecommerce-backend:latest
    container_name: ecommerce-backend-container
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:console.log@ecommerce-postgres:5432/ecommerce
      REDIS_URL: redis://ecommerce-redis:6379/0
      FRONTEND_URL: http://localhost:3000
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
      - ecommerce-media-data:/app/media
    depends_on:
      ecommerce-postgres:
        condition: service_healthy
      ecommerce-redis:
        condition: service_healthy
    networks:
      ecommerce-network:
        aliases:
          - ecommerce-backend
          - backend

  ecommerce-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ecommerce-frontend:latest
    container_name: ecommerce-frontend-container
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1
      INTERNAL_BACKEND_URL: http://ecommerce-backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - ecommerce-backend
    networks:
      - ecommerce-network

volumes:
  ecommerce-postgres-data:
  ecommerce-media-data:

networks:
  ecommerce-network:
    driver: bridge